
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        
        <title>Mi Navbar</title>
        <link rel="stylesheet" href="style.css">
    </head>
<body>
    <!---------------------- INICIO ------------------------>
    <header class="app-header">
        <button class="icon-boton">☰</button>
        <div class="logo">
            <img src="logo.png" alt="logo Papas" class="logo-icono">
            <div class="logo-texto">
                <span class="marca">MC PAPAS</span>
                <span class="eslogan">CALIENTE  · FRESCO ·  DELICIOSO</span>
            </div>
        </div>

        <!-------Botones: Carrito y Usuario------->
        <div class="boton-accion">
            <button class="icon-boton">
                <img src="user.png" alt="Perfil" class="icon-img">
            </button>
            <button class="icon-boton">
                <img src="carrito.png" alt="Carrito" class="icon-img">
            </button>   
        </div>
    </header>
    <!------------------ BARRA DE BUSQUEDA ----------------->
    <div class="search-row">
        <input type="text" placeholder="Busca papas, pizza, aderezo, bebidas...">
    </div>

    <!---------------- SECTOR DE CATEGORIAS ---------------->
    <div class="contenedor-categorias">
        <div class="categorias">
            <div class="categoria activa">
                <div class="categoria-icono">
                    <img src="todo_icon.png" alt="todo-menu">
                </div>
                <span class="categoria-texto">Comida</span>
            </div>
            <div class="categoria">
                <div class="categoria-icono">
                    <img src="bebida-icon.png" alt="Bebidas">
                </div>
                <span class="categoria-texto">Bebidas</span>
            </div>
            <div class="categoria">
                <div class="categoria-icono">
                    <img src="aderezo-icon.png" alt="Aderezos">
                </div>
                <span class="categoria-texto">Aderezos</span>
            </div>
            <div class="categoria">
                <div class="categoria-icono">
                    <img src="juguete-icon.png" alt="Juguetes">
                </div>
                <span class="categoria-texto">Juguetes</span>
            </div>
        </div>
    </div>

    <!------------------- PRODUCTOS ---------------->
    <div class="productos">
        <div class="producto">
            <div class="producto-img">
                <img src="hambur.grande.webp" alt="Zinger Burger">
                <button class="producto-fav">♡</button>
            </div>
            <h3 class="producto-nombre">Zinger Burger</h3>
            <p class="producto-desc">Crispy chicken with spicy mayo</p>
            <div class="producto-footer">
                <span class="producto-precio">$5.49</span>
                <button class="producto-add">+</button>
            </div>
        </div>

            </div>
        </div>

            </div>

</body>
</html>
